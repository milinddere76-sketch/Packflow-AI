name: CI Build - Electron (Windows) & Android (APK)

on:
  workflow_dispatch:
  push: {}

jobs:
  build_windows:
    name: Build Electron Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-artifacts
          path: |
            dist/**

  build_android:
    name: Build Android APK (Capacitor)
    runs-on: ubuntu-latest
    env:
      JAVA_HOME: /opt/hostedtoolcache/Java_TEMurin/jdk-11*/x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Android SDK (needed for Gradle builds)
        uses: r0adkll/setup-android@v2
        with:
          api-level: 33
          build-tools: "33.0.2"
          ndk: "21.4.7075529"

      - name: Install dependencies
        run: npm ci

      - name: Initialize Capacitor (non-interactive)
        run: |
          npx cap init PackFlow com.packflow.erp --web-dir=.
        shell: bash

      - name: Add Android platform
        run: |
          npx cap add android || true
        shell: bash

      - name: Copy web assets to native project
        run: npm run cap:copy
        shell: bash

      - name: Build Android APK (assembleRelease)
        working-directory: android
        run: |
          chmod +x gradlew || true
          ./gradlew assembleRelease -x lint
        shell: bash

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            android/app/build/outputs/**/*.apk
